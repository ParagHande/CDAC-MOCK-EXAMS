<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subject Practice | C-DAC Mumbai MCQ Practise Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body data-page="subject">
    <div class="site-shell">
      <!-- <header class="topbar">
            <a class="brand" href="../index.html">C-DAC Mumbai MCQ Practise Hub</a>
            <nav class="main-nav" aria-label="Primary">
                <a href="../index.html#subjects">All Subjects</a>
            </nav>
        </header> -->

      <main class="subject-page">
        <section class="subject-hero">
          <div>
            <!-- <p class="eyebrow">Practice module</p> -->
            <h1 id="subject-title">Loading subject...</h1>
            <p class="hero-text" id="subject-description">
              Choose a subject card from the home page to load its question
              bank.
            </p>
          </div>
          <div class="subject-stats">
            <div class="metric-card">
              <span class="metric-value" id="question-count">0</span>
              <!-- <span class="metric-label">Total questions</span> -->
            </div>
            <!-- <div class="metric-card">
              <span class="metric-value">10</span>
              <span class="metric-label">Per page</span>
            </div> -->
          </div>
        </section>

        <section
          class="subject-tabs"
          aria-label="Subject selector"
          id="subject-tabs"
        ></section>

        <section class="question-board">
          <div class="question-board-header">
            <h2>Question Bank</h2>
            <p id="page-indicator">Page 1</p>
          </div>
          <div class="status-message" id="status-message">
            Loading questions...
          </div>
          <div class="question-list" id="question-container"></div>
          <div class="pagination-controls" id="pagination"></div>
        </section>
      </main>

      <footer class="site-footer">
        <p>
          Switch subjects from the tabs above without changing the page layout.
        </p>
        <p>
          &copy; <span id="current-year"></span> C-DAC Mumbai MCQ Practise Hub
        </p>
      </footer>
    </div>

    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/pagination.js"></script>
    <script src="../assets/js/subjects.js"></script>
  </body>
</html>
